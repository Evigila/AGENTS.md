name: Verify framework

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
          - name: PowerShell 7 on Windows
            os: windows-latest
            shell: pwsh
          - name: PowerShell 7 on Linux
            os: ubuntu-latest
            shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check release hashes
        run: ./scripts/publish-framework.ps1 -Check
      - name: Test synchronization
        run: ./tests/test-sync.ps1
      - name: Smoke test Windows bootstrap
        if: runner.os == 'Windows'
        run: |
          $target = Join-Path $env:RUNNER_TEMP ('agents bootstrap ' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $target | Out-Null
          try {
            git init --quiet $target
            if ($LASTEXITCODE -ne 0) { throw 'Fixture Git init failed.' }
            Copy-Item ./fetch-agents.bat (Join-Path $target 'fetch-agents.bat')
            & (Join-Path $target 'fetch-agents.bat') -NonInteractive -SourcePath $env:GITHUB_WORKSPACE -Ref $env:GITHUB_SHA -Check
            if ($LASTEXITCODE -ne 2) { throw 'Fresh bootstrap Check must return 2.' }
            if (Test-Path (Join-Path $target 'AGENTS.lock.json')) { throw 'Check wrote a lock.' }
            if (Test-Path (Join-Path $target 'scripts')) { throw 'Check installed scripts.' }
            & (Join-Path $target 'fetch-agents.bat') -NonInteractive -SourcePath $env:GITHUB_WORKSPACE -Ref $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Fresh bootstrap install failed.' }
            & (Join-Path $target 'fetch-agents.bat') -NonInteractive -SourcePath $env:GITHUB_WORKSPACE -Check
            if ($LASTEXITCODE -ne 0) { throw 'Installed bootstrap Check failed or did not retain the commit pin.' }
          } finally {
            Remove-Item -LiteralPath $target -Recurse -Force
          }
